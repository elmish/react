name: .NET

on:
  push:
    branches: [ v4.x ]
  pull_request:
    branches: [ v4.x ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '9.0.x'
    - name: Build
      run: ./build.fsx
